services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: msn
      MONGO_INITDB_ROOT_PASSWORD: msn-development-only
    volumes:
      - mongodb7_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "msn", "--password", "msn-development-only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb7_data:
